workflows:
  ios-build:
    name: Build EPZ Game Turbo iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Build Unsigned Physical iPhone App
        script: |
          xcodebuild -project EPZGameTurbo.xcodeproj \
                     -scheme EPZGameTurbo \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build/ \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     build

      - name: Package IPA File
        script: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/EPZGameTurbo.app Payload/
          zip -r EPZGameTurbo-iOS.ipa Payload

    artifacts:
      - "*.ipa"
