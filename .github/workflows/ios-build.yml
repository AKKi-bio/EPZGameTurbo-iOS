name: Build iOS IPA (No Mac Needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Build iOS App Package
      run: |
        xcodebuild -project EPZGameTurbo.xcodeproj -scheme EPZGameTurbo -configuration Release -destination 'generic/platform=iOS' -archivePath build/EPZGameTurbo.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
        
    - name: Create Unsigned IPA Package
      run: |
        mkdir -p build/Payload
        cp -r build/EPZGameTurbo.xcarchive/Products/Applications/*.app build/Payload/
        cd build && zip -r EPZGameTurbo-iOS.ipa Payload

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: EPZGameTurbo-iOS-IPA
        path: build/EPZGameTurbo-iOS.ipa
