name: Build iOS IPA (No Mac Needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Download & Run XcodeGen
      run: |
        curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.38.0/xcodegen.zip -o xcodegen.zip
        unzip -o -q xcodegen.zip
        XCODEGEN_BIN=$(find . -name "xcodegen" -type f -perm +111 2>/dev/null || find . -name "xcodegen" -type f | head -n 1)
        echo "Found XcodeGen at: $XCODEGEN_BIN"
        chmod +x "$XCODEGEN_BIN"
        "$XCODEGEN_BIN" generate

    - name: Build Unsigned App Package with Xcode
      run: |
        xcodebuild -project EPZGameTurbo.xcodeproj \
                   -scheme EPZGameTurbo \
                   -sdk iphonesimulator \
                   -configuration Release \
                   -derivedDataPath build/ \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   build

    - name: Package into IPA Archive
      run: |
        mkdir -p build/Payload
        cp -r build/Build/Products/Release-iphonesimulator/EPZGameTurbo.app build/Payload/
        cd build && zip -r EPZGameTurbo-iOS.ipa Payload
        echo "Final IPA File Size: $(ls -lh EPZGameTurbo-iOS.ipa)"

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EPZGameTurbo-iOS-IPA
        path: build/EPZGameTurbo-iOS.ipa
