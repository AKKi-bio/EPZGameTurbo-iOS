name: Build iOS IPA (No Mac Needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Build Physical iPhone App Package with Xcode
      run: |
        xcodebuild -project EPZGameTurbo.xcodeproj \
                   -scheme EPZGameTurbo \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build/ \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   build 2>&1 | tee build_log.txt || true

    - name: Package into IPA Archive
      run: |
        mkdir -p build/Payload
        APP_PATH=$(find build/ -name "*.app" | head -n 1)
        echo "Found compiled App at: $APP_PATH"
        
        if [ -n "$APP_PATH" ]; then
          cp -r "$APP_PATH" build/Payload/
        fi

        cd build && zip -r EPZGameTurbo-iOS.ipa Payload
        echo "Final Physical iPhone IPA File Size: $(ls -lh EPZGameTurbo-iOS.ipa)"

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EPZGameTurbo-iOS-IPA
        path: build/EPZGameTurbo-iOS.ipa
