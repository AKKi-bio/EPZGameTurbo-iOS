name: Build iOS IPA (No Mac Needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Compile iOS Binary via Apple Swift Compiler
      run: |
        mkdir -p build/Payload/EPZGameTurbo.app
        
        # Compile all Swift files into ARM64 iOS executable
        xcrun -sdk iphoneos swiftc -target arm64-apple-ios15.0 -parse-as-library \
          EPZGameTurbo/App/EPZGameTurboApp.swift \
          EPZGameTurbo/Models/LicenseManager.swift \
          EPZGameTurbo/Models/SuperTouchPrefs.swift \
          EPZGameTurbo/Models/SystemMonitor.swift \
          EPZGameTurbo/Views/LicenseView.swift \
          EPZGameTurbo/Views/MainDashboardView.swift \
          EPZGameTurbo/Views/FloatingOverlayView.swift \
          EPZGameTurbo/Views/SensitivityOverlayView.swift \
          -o build/Payload/EPZGameTurbo.app/EPZGameTurbo

        # Copy Info.plist into app bundle
        cp EPZGameTurbo/Resources/Info.plist build/Payload/EPZGameTurbo.app/

    - name: Package into IPA Archive
      run: |
        cd build && zip -r EPZGameTurbo-iOS.ipa Payload

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: EPZGameTurbo-iOS-IPA
        path: build/EPZGameTurbo-iOS.ipa
