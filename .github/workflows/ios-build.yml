name: Build iOS IPA (No Mac Needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Inspect Xcode Project Schemes
      run: xcodebuild -project EPZGameTurbo.xcodeproj -list

    - name: Build iOS App Bundle
      run: |
        xcodebuild -project EPZGameTurbo.xcodeproj \
                   -scheme EPZGameTurbo \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build/ \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   COMPILER_INDEX_STORE_ENABLE=NO \
                   build

    - name: Package into IPA Archive
      run: |
        mkdir -p build/Payload
        cp -r build/Build/Products/Release-iphoneos/EPZGameTurbo.app build/Payload/
        cd build && zip -r EPZGameTurbo-iOS.ipa Payload

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: EPZGameTurbo-iOS-IPA
        path: build/EPZGameTurbo-iOS.ipa
