name: Build iOS IPA (No Mac Needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Build Swift Package for iOS Simulator
      run: |
        swift build --sdk $(xcrun --sdk iphonesimulator --show-sdk-path) -Xswiftc -target -Xswiftc arm64-apple-ios15.0-simulator

    - name: Package into IPA Archive
      run: |
        mkdir -p build/Payload/EPZGameTurbo.app
        cp -r .build/arm64-apple-ios15.0-simulator/debug/* build/Payload/EPZGameTurbo.app/ 2>/dev/null || cp -r .build/debug/* build/Payload/EPZGameTurbo.app/ 2>/dev/null || true
        cat << 'EOF' > build/Payload/EPZGameTurbo.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>EPZGameTurbo</string>
            <key>CFBundleIdentifier</key>
            <string>com.epz.gameturbo.ios</string>
            <key>CFBundleName</key>
            <string>EPZ Game Turbo</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.82.0</string>
            <key>CFBundleVersion</key>
            <string>99</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>NSAppTransportSecurity</key>
            <dict>
                <key>NSAllowsArbitraryLoads</key>
                <true/>
            </dict>
        </dict>
        </plist>
        EOF
        cd build && zip -r EPZGameTurbo-iOS.ipa Payload

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: EPZGameTurbo-iOS-IPA
        path: build/EPZGameTurbo-iOS.ipa
