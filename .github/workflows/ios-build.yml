name: Build iOS IPA (No Mac Needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Compile Native iOS Binary & Package IPA
      run: |
        mkdir -p build/Payload/EPZGameTurbo.app
        
        SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
        echo "Using Simulator SDK: $SDK_PATH"

        echo "=== ENGINE 1: SWIFTC DIRECT COMPILER ==="
        swiftc -sdk "$SDK_PATH" \
               -target arm64-apple-ios15.0-simulator \
               -module-name EPZGameTurbo \
               -framework SwiftUI \
               -framework UIKit \
               -framework Foundation \
               EPZGameTurbo/AppDelegate.swift \
               EPZGameTurbo/EPZGameTurboApp.swift \
               EPZGameTurbo/LicenseManager.swift \
               EPZGameTurbo/SuperTouchPrefs.swift \
               EPZGameTurbo/SystemMonitor.swift \
               EPZGameTurbo/LicenseView.swift \
               EPZGameTurbo/MainDashboardView.swift \
               EPZGameTurbo/FloatingOverlayView.swift \
               EPZGameTurbo/SensitivityOverlayView.swift \
               -o build/Payload/EPZGameTurbo.app/EPZGameTurbo || true

        if [ ! -s build/Payload/EPZGameTurbo.app/EPZGameTurbo ]; then
          echo "=== ENGINE 2: XCODEBUILD COMPILER ==="
          xcodebuild -project EPZGameTurbo.xcodeproj \
                     -scheme EPZGameTurbo \
                     -sdk iphonesimulator \
                     -derivedDataPath build/ \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     build || true
          
          APP_PATH=$(find build/ -name "*.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH"/* build/Payload/EPZGameTurbo.app/
          fi
        fi

        if [ ! -f build/Payload/EPZGameTurbo.app/Info.plist ]; then
          cp EPZGameTurbo/Info.plist build/Payload/EPZGameTurbo.app/Info.plist 2>/dev/null || true
        fi

        chmod +x build/Payload/EPZGameTurbo.app/EPZGameTurbo 2>/dev/null || true

        cd build && zip -r EPZGameTurbo-iOS.ipa Payload
        echo "Final IPA File Size: $(ls -lh EPZGameTurbo-iOS.ipa)"

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EPZGameTurbo-iOS-IPA
        path: build/EPZGameTurbo-iOS.ipa
