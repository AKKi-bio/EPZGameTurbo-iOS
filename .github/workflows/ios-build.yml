name: Build iOS IPA (No Mac Needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Swift & Xcode
      run: swift package resolve

    - name: Build Swift Package App
      run: swift build -c release

    - name: Create Unsigned IPA Package
      run: |
        mkdir -p build/Payload
        cp .build/release/EPZGameTurbo build/Payload/ 2>/dev/null || cp -r .build/release/*.build build/Payload/ 2>/dev/null || true
        cd build && zip -r EPZGameTurbo-iOS.ipa Payload

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: EPZGameTurbo-iOS-IPA
        path: build/EPZGameTurbo-iOS.ipa
