name: Build iOS IPA (No Mac Needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Compile and Package IPA
      run: |
        set +e
        mkdir -p build/Payload/EPZGameTurbo.app

        SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
        echo "Using SDK Path: $SDK_PATH"

        swiftc -sdk "$SDK_PATH" \
               -target arm64-apple-ios15.0-simulator \
               -module-name EPZGameTurbo \
               -parse-as-library \
               -framework SwiftUI \
               -framework UIKit \
               -framework Foundation \
               EPZGameTurbo/EPZGameTurboApp.swift \
               EPZGameTurbo/LicenseManager.swift \
               EPZGameTurbo/SuperTouchPrefs.swift \
               EPZGameTurbo/SystemMonitor.swift \
               EPZGameTurbo/LicenseView.swift \
               EPZGameTurbo/MainDashboardView.swift \
               EPZGameTurbo/FloatingOverlayView.swift \
               EPZGameTurbo/SensitivityOverlayView.swift \
               -o build/Payload/EPZGameTurbo.app/EPZGameTurbo

        cp EPZGameTurbo/Info.plist build/Payload/EPZGameTurbo.app/Info.plist 2>/dev/null || true

        if [ ! -f build/Payload/EPZGameTurbo.app/Info.plist ]; then
          cat << 'EOF' > build/Payload/EPZGameTurbo.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>EPZGameTurbo</string>
            <key>CFBundleIdentifier</key>
            <string>com.epz.gameturbo.ios</string>
            <key>CFBundleName</key>
            <string>EPZ Game Turbo</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.82.0</string>
            <key>CFBundleVersion</key>
            <string>99</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
        </dict>
        </plist>
        EOF
        fi

        chmod +x build/Payload/EPZGameTurbo.app/EPZGameTurbo 2>/dev/null || true
        cd build && zip -r EPZGameTurbo-iOS.ipa Payload

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: EPZGameTurbo-iOS-IPA
        path: build/EPZGameTurbo-iOS.ipa
