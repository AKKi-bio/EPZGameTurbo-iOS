name: Build iOS IPA (No Mac Needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Generate Xcode Project File & Scheme
      run: python3 generate_xcodeproj.py

    - name: Build Unsigned App Package
      run: |
        mkdir -p build/Payload/EPZGameTurbo.app

        echo "Attempting xcodebuild compilation..."
        xcodebuild -project EPZGameTurbo.xcodeproj \
                   -scheme EPZGameTurbo \
                   -sdk iphonesimulator \
                   -derivedDataPath build/ \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   build || true

        if [ -f build/Build/Products/Release-iphonesimulator/EPZGameTurbo.app/EPZGameTurbo ]; then
          echo "xcodebuild succeeded! Copying app bundle..."
          cp -r build/Build/Products/Release-iphonesimulator/*.app/* build/Payload/EPZGameTurbo.app/
        else
          echo "xcodebuild fallback triggered: compiling directly via swiftc..."
          SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          swiftc -sdk "$SDK_PATH" \
                 -target arm64-apple-ios15.0-simulator \
                 -module-name EPZGameTurbo \
                 -parse-as-library \
                 EPZGameTurbo/*.swift \
                 -o build/Payload/EPZGameTurbo.app/EPZGameTurbo
        fi

        if [ ! -f build/Payload/EPZGameTurbo.app/Info.plist ]; then
          echo "Adding Info.plist..."
          cp EPZGameTurbo/Info.plist build/Payload/EPZGameTurbo.app/Info.plist
        fi

        chmod +x build/Payload/EPZGameTurbo.app/EPZGameTurbo

    - name: Package into IPA Archive
      run: |
        cd build && zip -r EPZGameTurbo-iOS.ipa Payload

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: EPZGameTurbo-iOS-IPA
        path: build/EPZGameTurbo-iOS.ipa
