name: Build iOS IPA (No Mac Needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Generate Xcode Project & Shared Scheme
      run: python3 generate_xcodeproj.py

    - name: Build Unsigned iOS App Package
      run: |
        xcodebuild -project EPZGameTurbo.xcodeproj \
                   -scheme EPZGameTurbo \
                   -destination 'generic/platform=iOS' \
                   -configuration Release \
                   -derivedDataPath build/ \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   build

    - name: Package into IPA Archive
      run: |
        mkdir -p build/Payload
        cp -r build/Build/Products/Release-iphoneos/*.app build/Payload/
        cd build && zip -r EPZGameTurbo-iOS.ipa Payload

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: EPZGameTurbo-iOS-IPA
        path: build/EPZGameTurbo-iOS.ipa
