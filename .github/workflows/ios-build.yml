name: Build iOS IPA (No Mac Needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Download XcodeGen Direct Binary
      run: |
        curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.38.0/xcodegen.zip -o xcodegen.zip
        unzip -q xcodegen.zip
        sudo cp xcodegen/bin/xcodegen /usr/local/bin/

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build Unsigned App Package
      run: |
        xcodebuild -project EPZGameTurbo.xcodeproj \
                   -scheme EPZGameTurbo \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build/ \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=YES \
                   build

    - name: Package into IPA Archive
      run: |
        mkdir -p build/Payload
        cp -r build/Build/Products/Release-iphoneos/*.app build/Payload/
        cd build && zip -r EPZGameTurbo-iOS.ipa Payload

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: EPZGameTurbo-iOS-IPA
        path: build/EPZGameTurbo-iOS.ipa
