name: Build iOS IPA (No Mac Needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Compile ARM64 iOS Binary
      run: |
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "SDK Path: $SDK_PATH"
        
        swiftc -sdk "$SDK_PATH" \
               -target arm64-apple-ios15.0 \
               -emit-executable \
               -module-name EPZGameTurbo \
               -parse-as-library \
               EPZGameTurbo/EPZGameTurboApp.swift \
               EPZGameTurbo/LicenseManager.swift \
               EPZGameTurbo/SuperTouchPrefs.swift \
               EPZGameTurbo/SystemMonitor.swift \
               EPZGameTurbo/LicenseView.swift \
               EPZGameTurbo/MainDashboardView.swift \
               EPZGameTurbo/FloatingOverlayView.swift \
               EPZGameTurbo/SensitivityOverlayView.swift \
               -o EPZGameTurbo_binary

    - name: Assemble App Bundle and Info.plist
      run: |
        mkdir -p build/Payload/EPZGameTurbo.app
        cp EPZGameTurbo_binary build/Payload/EPZGameTurbo.app/EPZGameTurbo
        chmod +x build/Payload/EPZGameTurbo.app/EPZGameTurbo

        cat << 'EOF' > build/Payload/EPZGameTurbo.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>EPZGameTurbo</string>
            <key>CFBundleIdentifier</key>
            <string>com.epz.gameturbo.ios</string>
            <key>CFBundleName</key>
            <string>EPZ Game Turbo</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.82.0</string>
            <key>CFBundleVersion</key>
            <string>99</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>NSAppTransportSecurity</key>
            <dict>
                <key>NSAllowsArbitraryLoads</key>
                <true/>
            </dict>
        </dict>
        </plist>
        EOF

    - name: Package into IPA Archive
      run: |
        cd build && zip -r EPZGameTurbo-iOS.ipa Payload

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: EPZGameTurbo-iOS-IPA
        path: build/EPZGameTurbo-iOS.ipa
