name: Build iOS IPA (No Mac Needed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Build Unsigned App
      run: |
        xcodebuild -project EPZGameTurbo.xcodeproj \
                   -scheme EPZGameTurbo \
                   -sdk iphoneos \
                   -configuration Release \
                   -archivePath build/EPZGameTurbo.xcarchive \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   archive || true

    - name: Fallback Direct Swift Compiler
      run: |
        if [ ! -f "build/EPZGameTurbo.xcarchive/Products/Applications/EPZGameTurbo.app/EPZGameTurbo" ]; then
          mkdir -p build/Payload/EPZGameTurbo.app
          xcrun -sdk iphoneos swiftc -target arm64-apple-ios15.0 -parse-as-library \
            EPZGameTurbo/EPZGameTurboApp.swift \
            EPZGameTurbo/LicenseManager.swift \
            EPZGameTurbo/SuperTouchPrefs.swift \
            EPZGameTurbo/SystemMonitor.swift \
            EPZGameTurbo/LicenseView.swift \
            EPZGameTurbo/MainDashboardView.swift \
            EPZGameTurbo/FloatingOverlayView.swift \
            EPZGameTurbo/SensitivityOverlayView.swift \
            -o build/Payload/EPZGameTurbo.app/EPZGameTurbo
        fi

    - name: Package into IPA
      run: |
        mkdir -p build/Payload
        if [ -d "build/EPZGameTurbo.xcarchive/Products/Applications" ]; then
          cp -r build/EPZGameTurbo.xcarchive/Products/Applications/*.app build/Payload/ 2>/dev/null || true
        fi
        cd build && zip -r EPZGameTurbo-iOS.ipa Payload

    - name: Upload Built IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: EPZGameTurbo-iOS-IPA
        path: build/EPZGameTurbo-iOS.ipa
